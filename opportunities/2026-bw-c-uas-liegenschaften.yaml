notes: >
  UNVERIFIED FIXTURE, and deliberately so. It represents the shape of a German defence
  procurement under the BwPBBG regime in force since 2026-02-14: participation may be
  restricted to EU-resident applicants and bidders, and Losaufteilung is dispensed with.
  The point of including it is to exercise the third-country rule — and to make visible
  that a scanner cannot reliably find the real version of this notice, because raised
  value limits for Direktaufträge and the Art. 346 TFEU / §107 Abs. 2 GWB exemptions keep
  much of this flow unpublished. See docs/07-case-findings.md.
