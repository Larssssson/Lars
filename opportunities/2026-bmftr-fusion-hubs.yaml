notes: >
  Part of the Fusion 2040 programme. Three thematic hubs — laser fusion, magnetic
  fusion (stellarator), fuel cycle and materials. BMFTR providing EUR 125m initially.
  The laser fusion hub, VEGA, is coordinated by Marvel Fusion with Focused Energy.
  Included in the fixture set precisely because it is already decided: a radar that
  surfaces this to Marvel Fusion in September 2026 as an opportunity is wrong, and the
  deadline rule is what stops it.
