# Demo-Server von impress bei Render (DECISIONS D-122, Anleitung in docs/demo-server.md).
# Ein Web-Dienst (App und Worker) in Frankfurt und eine PostgreSQL-Datenbank; nur erfundene Beispieldaten.
services:
  - type: web
    name: impress-demo
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: bash scripts/demo-start.sh
    region: frankfurt
    plan: 1c-2g
    branch: main
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: impress-demo-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_PROVIDER
        value: dev
      - key: DEMO_MODE
        value: "true"
      # gemeinsames Passwort für die ganze Seite, wird beim Anlegen im Render-Dashboard abgefragt
      - key: DEMO_PASSWORD
        sync: false
      - key: TZ
        value: Europe/Berlin

databases:
  - name: impress-demo-db
    region: frankfurt
    plan: 0.1c-256mb
    postgresMajorVersion: "16"
    databaseName: impress
