# Server von impress bei Render (DECISIONS D-122, Live-Test D-131, Anleitung in docs/demo-server.md).
# Ein Web-Dienst (App und Worker) in Frankfurt und eine PostgreSQL-Datenbank.
# Live-Test: Anmeldung mit Passwort, keine Beispieldaten, Dateien in der Datenbank.
services:
  - type: web
    name: impress-demo
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: bash scripts/demo-start.sh
    region: frankfurt
    plan: 1c-2g
    branch: main
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: impress-demo-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_PROVIDER
        value: password
      - key: IMPRESS_LIVE
        value: "true"
      - key: FILE_STORAGE
        value: database
      # einmaliges Leeren und Startpasswörter (D-131), im Render-Dashboard gesetzt
      - key: IMPRESS_LIVE_RESET
        sync: false
      - key: INITIAL_PASSWORD_HASHES
        sync: false
      - key: TZ
        value: Europe/Berlin

databases:
  - name: impress-demo-db
    region: frankfurt
    plan: 0.1c-256mb
    postgresMajorVersion: "16"
    databaseName: impress
