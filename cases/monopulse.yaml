notes:
  - >
    THE SOURCES WERE NOT IN CONFLICT — BOTH WERE RIGHT. ArcticStartup and Vestbee describe
    a Danish firm; TechFundingNews describes it as Lithuania-based; the investor ILTE is
    the Lithuanian state development finance institution. The company is established in
    both. Worth recording as a methodological point: the profile had this field as
    unknown rather than picking the likelier reading, and the resolution was a structure
    neither source described. A system that had guessed "Lithuania" would have been
    half right and fully confident.
  - >
    DUAL ESTABLISHMENT IS AN ASSET AND A COMPLICATION. Asset: access to both Danish and
    Lithuanian national programmes, and useful flexibility on EDIP consortium composition,
    where multi-Member-State participation is generally what the instruments are designed
    to reward. Complication: two entities probably means a group, and a group means the
    KMU test runs on consolidated figures. Which entity holds the contracts, the staff and
    the IP is now the question that decides eligibility — and it is the same question the
    other three cases raise in a different costume.
  - >
    NO GERMAN PRESENCE FOUND. Without a German Betriebsstätte, the German funding half of
    the radar is structurally unavailable — Bund programmes generally require it and every
    Land programme certainly does. What remains is EU-level instruments and German
    procurement open to EU bidders.
  - >
    THE SMALLEST OF THE FOUR CASES, and the one where Eignungskriterien will bind hardest.
    A EUR 1.12m raise implies a company that will fail Mindestumsatz and reference
    requirements on most substantial tenders. That makes the reversible kills — Bieter-
    gemeinschaft, Eignungsleihe, subcontracting to a prime — the main product for this
    client rather than a footnote.
