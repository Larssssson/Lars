notes:
  - >
    COUNTRY OF ESTABLISHMENT IS CONTESTED IN PUBLIC SOURCES and it is the field that
    decides almost everything else. ArcticStartup describes a "Danish UAV maker"; Vestbee
    describes a "Danish firm"; TechFundingNews describes it as Lithuania-based. The
    investor, ILTE, is the Lithuanian state development finance institution, which points
    to Lithuania — but pointing is not knowing. Both candidates are EU Member States, so
    EU-level eligibility is unaffected either way; German Land programmes and any German
    procurement with a local-presence requirement are not. Left as unknown on purpose:
    this is exactly the case where a guess would look like an answer.
  - >
    NO GERMAN PRESENCE FOUND. Without a German Betriebsstätte, the German funding half of
    the radar is structurally unavailable — Bund programmes generally require it and every
    Land programme certainly does. What remains is EU-level instruments and German
    procurement open to EU bidders.
  - >
    THE SMALLEST OF THE FOUR CASES, and the one where Eignungskriterien will bind hardest.
    A EUR 1.12m raise implies a company that will fail Mindestumsatz and reference
    requirements on most substantial tenders. That makes the reversible kills — Bieter-
    gemeinschaft, Eignungsleihe, subcontracting to a prime — the main product for this
    client rather than a footnote.
