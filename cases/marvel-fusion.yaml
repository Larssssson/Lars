notes:
  - >
    OWNERSHIP IS THE BINDING UNKNOWN. USD 160m raised over four rounds, latest a
    Series B on 2025-03-27 with five investors. Under Empfehlung 2003/361/EG Art. 3(2)(a)
    certain investors — venture capital companies, institutional investors, universities —
    may hold up to 50% without creating a partner enterprise. A strategic corporate
    investor at 25% or more does create one, and pro-rata consolidation with a large
    company would very likely break KMU status. Headcount 121 is comfortably inside the
    ceiling; the cap table decides everything else. This is one question to a CFO and it
    changes which half of the German funding landscape is available.
  - >
    ALREADY FEDERALLY FUNDED. Marvel Fusion coordinates the VEGA laser-fusion hub together
    with Focused Energy under the BMFTR "Hubs für die Fusion" Bekanntmachung of 2026-04-17,
    part of the Fusion 2040 programme; BMFTR is providing EUR 125m across three hubs,
    announced 2026-07-29. This matters twice over: Kumulierungsverbot on any overlapping
    costs, and the fact that the obvious opportunity is already won, so the real question
    is what comes next.
  - >
    NOTE THE MINISTRY RENAME: BMBF is now BMFTR (Bundesministerium für Forschung,
    Technologie und Raumfahrt). Any source list or programme catalogue written before 2025
    has the wrong name and quite possibly the wrong URLs.
  - >
    MUNICH IS NOT A GRW-FÖRDERGEBIET. Regional investment aid under the GRW is not
    available at this location. Assumption — confirm against the current Fördergebietskarte
    before relying on it.
