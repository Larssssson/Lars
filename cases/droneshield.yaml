notes:
  - >
    THIS CASE EXISTS TO BE KILLED, AND THAT IS ITS VALUE. Australian establishment and
    roughly EUR 150m of revenue put DroneShield outside EU funding entirely and outside
    KMU-gated instruments twice over. EDIP eligibility runs to EU Member States, Norway
    and Ukraine. The BwPBBG, in force since 2026-02-14, lets contracting authorities
    restrict participation to EU-resident applicants and bidders. A radar that surfaces
    German and EU funding calls for this client is producing pure noise.
  - >
    WHAT IS ACTUALLY USEFUL HERE IS THE INVERSE OF THE PRODUCT. For DroneShield the
    scannable value is: procurement notices that do NOT invoke the third-country
    restriction; award notices naming EU primes worth approaching as a route to market
    — the existing Benelux reseller relationship is precisely this pattern; and tracking
    whether the announced European facility creates an EU establishment that changes the
    eligibility picture. That is monitoring plus positioning advice, not a funding radar.
  - >
    STRONGEST EIGNUNG OF THE FOUR CASES BY A DISTANCE. Where DroneShield can bid, it
    clears Mindestumsatz and reference requirements that would kill the other three.
    Eligibility and capacity run in opposite directions across this case set, which is
    worth remembering before generalising from any one client.
