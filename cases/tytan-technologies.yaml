notes:
  - >
    THE MOST IMPORTANT FACT ABOUT THIS CASE IS A NEGATIVE ONE. Application domain is
    military, which excludes TYTAN from a large share of German civil research funding —
    BMFTR and BMWK programmes routinely carry a Zivilklausel, and a university Verbund
    partner will usually have one of its own even where the programme does not. The
    civil-funding half of the radar is close to empty for this client, and saying so
    early is more useful than a shortlist of things they cannot have.
  - >
    OWNERSHIP AGAIN DECIDES KMU STATUS. Series A of EUR 30m led by the NATO Innovation
    Fund with Armira; approximately EUR 46m raised in total. NIF plausibly falls within
    the institutional-investor exception in Art. 3(2)(a); Armira's stake and character
    decide whether a partner or linked enterprise arises. Unresolved until someone reads
    the cap table.
  - >
    KMU STATUS HAS AN EXPIRY DATE HERE, AND THAT IS ADVICE WORTH GIVING. At roughly 200
    staff TYTAN sits at 80% of the 250 ceiling while building out serial production. The
    KMU-gated instruments — EDIP FAST equity among them — are available for a limited
    number of application cycles. The Annex to Empfehlung 2003/361/EG, Art. 4(2), gives a
    buffer: ceilings must be exceeded over two consecutive accounting periods before the
    status is lost. So crossing 250 in one year does not end it immediately, but it starts
    the clock. Anything KMU-gated should be applied for while the window is open.
  - >
    EU DEFENCE FUNDING IS THE LIVE ROUTE. EDIP's first calls were published on the EU
    Funding & Tenders Portal on 2026-03-31 under a EUR 1.5bn work programme adopted
    2026-03-30, with over EUR 700m for production increases explicitly including
    counter-drone systems, EUR 240m for joint procurement of counter-drone and air
    defence, and EUR 100m of equity support for defence start-ups and SMEs through FAST.
    Eligibility runs to EU Member States, Norway and Ukraine — TYTAN qualifies on
    establishment.
